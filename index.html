<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かな の おと</title>

<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    text-align: center;
    padding: 20px;
  }

  #menu button {
    font-size: 24px;
    padding: 15px 30px;
    margin: 10px;
    cursor: pointer;
  }

  #cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
    gap: 10px;
    margin-top: 20px;
  }

  .card {
    font-size: 32px;
    padding: 15px 0;
    border: 2px solid #ccc;
    border-radius: 10px;
    cursor: pointer;
    background: white;
    transition: background 0.2s, transform 0.1s;
  }

  .card.active {
    background: #ffe680;
    transform: scale(1.1);
  }
</style>
</head>
<body>

<h1>かな の おと</h1>

<div id="menu">
  <button onclick="start('hiragana')">ひらがなHiragana</button>
  <button onclick="start('katakana')">カタカナKatakana</button>
</div>

<div id="cards"></div>

<audio id="audio"></audio>

<script>
const kanaData = {
  hiragana: [
    ["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
    ["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],
    ["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],
    ["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],
    ["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],
    ["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],
    ["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],
    ["や","ya"],["ゆ","yu"],["よ","yo"],
    ["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],
    ["わ","wa"],["を","wo"],["ん","n"]
  ],
  katakana: [
    ["ア","a"],["イ","i"],["ウ","u"],["エ","e"],["オ","o"],
    ["カ","ka"],["キ","ki"],["ク","ku"],["ケ","ke"],["コ","ko"],
    ["サ","sa"],["シ","shi"],["ス","su"],["セ","se"],["ソ","so"],
    ["タ","ta"],["チ","chi"],["ツ","tsu"],["テ","te"],["ト","to"],
    ["ナ","na"],["ニ","ni"],["ヌ","nu"],["ネ","ne"],["ノ","no"],
    ["ハ","ha"],["ヒ","hi"],["フ","fu"],["ヘ","he"],["ホ","ho"],
    ["マ","ma"],["ミ","mi"],["ム","mu"],["メ","me"],["モ","mo"],
    ["ヤ","ya"],["ユ","yu"],["ヨ","yo"],
    ["ラ","ra"],["リ","ri"],["ル","ru"],["レ","re"],["ロ","ro"],
    ["ワ","wa"],["ヲ","wo"],["ン","n"]
  ]
};

let currentType = "hiragana";

function start(type) {
  currentType = type;
  document.getElementById("menu").style.display = "none";
  renderCards();
}

function renderCards() {
  const container = document.getElementById("cards");
  container.innerHTML = "";

  kanaData[currentType].forEach(([kana, romaji]) => {
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = kana;
    card.onclick = () => playSound(card, romaji);
    container.appendChild(card);
  });
}

function playSound(card, romaji) {
  const audio = document.getElementById("audio");

  document.querySelectorAll(".card").forEach(c =>
    c.classList.remove("active")
  );

  card.classList.add("active");

  audio.src = `sounds/${romaji}.m4a`;
  audio.currentTime = 0;
  audio.play();
}
</script>

</body>
</html>
